  <text x="843" y="280" text-anchor="middle" font-size="10.5" fill="#6b5a3b">宿主死后游荡 drift after death</text>

  <rect x="742" y="316" width="202" height="72" rx="8" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.2"/>
  <text x="843" y="340" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3d2e15">名望场 Standing field</text>
  <text x="843" y="358" text-anchor="middle" font-size="10.5" fill="#6b5a3b">分布式 distributed</text>
  <text x="843" y="374" text-anchor="middle" font-size="10.5" fill="#6b5a3b">从见证算出，无全局排行</text>

  <text x="843" y="416" text-anchor="middle" font-size="10.5" fill="#6b5a3b">这三条通道是唯一的入口——</text>
  <text x="843" y="432" text-anchor="middle" font-size="10.5" fill="#6b5a3b">没有开发者写死的文化类型</text>

  <!-- arrow channels -> content -->
  <line x1="728" y1="286" x2="704" y2="286" stroke="#8a6d3b" stroke-width="2.4"/>
