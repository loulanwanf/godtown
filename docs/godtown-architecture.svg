  <!-- ================= 底部注释 ================= -->
  <rect x="150" y="536" width="806" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/>
  <text x="168" y="562" font-size="12.5" fill="#374151">演化唯一管道 = 观念池（自由文本，无类型；产生 1.2%/日 · 传播 8% · 变异 15% · 结晶 = 30% 成年人口且适应度 ≥ 0.45）。</text>
  <text x="168" y="584" font-size="12.5" fill="#374151">The sole evolutionary pipeline is the idea pool (free text, untyped).</text>
  <text x="168" y="610" font-size="12.5" fill="#374151">D34 铁律：同 seed → 同世界（主骰流确定性；Math.random / Date.now 清出模拟链；离镇者走独立骰流 wrng）。